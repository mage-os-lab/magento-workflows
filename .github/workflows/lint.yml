name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax check
        run: |
          set -e
          find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files pass syntax check"

  xml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: XML well-formedness check
        run: |
          set -e
          find src -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout
          echo "All XML files are well-formed"

  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON validity check
        run: |
          set -e
          find src -name '*.json' -print0 | xargs -0 -n1 -I{} php -r 'json_decode(file_get_contents("{}"), true, 512, JSON_THROW_ON_ERROR);'
          echo "All JSON files are valid"
