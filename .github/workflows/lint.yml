name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax check
        run: |
          set -e
          find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files pass syntax check"

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run standalone unit tests
        run: php dev/tests/standalone-runner.php

  dependency-honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Dependency-honesty check
        run: php dev/tools/dependency-honesty-check.php

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: i18n catalog check
        run: php dev/tools/i18n-collect-phrases.php --check

  xml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: XML well-formedness check
        run: |
          set -e
          find src -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout
          echo "All XML files are well-formed"

  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON validity check
        run: |
          set -e
          find src spec -name '*.json' -print0 | xargs -0 -n1 -I{} php -r 'json_decode(file_get_contents("{}"), true, 512, JSON_THROW_ON_ERROR);'
          echo "All JSON files are valid"
