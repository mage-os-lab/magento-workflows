name: Canvas

# The canvas package owns the only Node toolchain in the repo (lint.yml has no
# Node at all). This workflow is authoritative for the committed IIFE bundle:
# it rebuilds it, fails on any drift, and runs the vitest suite. It also greps
# the built bundle for eval / new Function (CSP posture: none allowed).

on:
  push:
    branches: [main]
    paths:
      - 'src/module-workflows-canvas/**'
      - '.github/workflows/canvas.yml'
      - 'spec/fixtures/**'
  pull_request:
    paths:
      - 'src/module-workflows-canvas/**'
      - '.github/workflows/canvas.yml'
      - 'spec/fixtures/**'

defaults:
  run:
    working-directory: src/module-workflows-canvas/app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/module-workflows-canvas/app/package-lock.json

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck + vitest
        run: |
          npm run typecheck
          npm run test

      - name: Build IIFE bundle
        run: npm run build

      # The smoke drives the real built bundle through the mount contract (load
      # fixture -> edit -> save -> assert posted definition) with a mocked admin
      # page — no Magento. GitHub runners ship no browsers, so install just
      # Chromium here (the agent dev env preinstalls it; CI does not). A FULL
      # end-to-end against a real store is a separate, unautomated check —
      # documented in docs/11-admin-ui.md (needs a Magento fixture + admin auth).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (mount contract)
        run: npm run test:e2e

      - name: CSP gate — no eval / new Function in the bundle
        run: |
          set -e
          if grep -nE '[^a-zA-Z0-9_.]eval\(|new +Function' ../view/adminhtml/web/js/dist/canvas.js; then
            echo "::error::eval/new Function found in built bundle (CSP violation)"
            exit 1
          fi
          echo "No eval / new Function in the bundle."

      # The bundle inlines every dependency (no externals), so their licenses
      # ride along with the distributed file — elkjs is EPL-2.0, which requires
      # its notice and a source-availability statement to travel with it. The
      # notices file is generated from the lockfile, so a dependency bump that
      # forgets `npm run notices` is a compliance regression, not a nit.
      - name: Attribution gate — THIRD-PARTY-NOTICES.txt matches the lockfile
        run: |
          npm run notices
          git diff --exit-code ../THIRD-PARTY-NOTICES.txt

      - name: Drift check — committed dist matches a fresh build
        run: git diff --exit-code ../view/adminhtml/web/js/dist
