# Adapted from graycoreio/github-actions-magento2 `.github/workflows/check-extension.yaml`.
#
# The upstream reusable workflow tests a SINGLE extension: it registers one
# Composer path repository (`inputs.path`) and requires one package. This repo
# is a monorepo of ten interdependent, unpublished `mage-os/workflows*`
# packages (every module requires the core `mage-os/workflows`; several require
# sibling modules). A single path repo can't resolve those siblings, so instead
# of calling the upstream reusable workflow we reuse its composite actions
# (`setup-magento`, `cache-magento`, `setup-di-compile`, `coding-standard`,
# `supported-version`) and register a wildcard path repo (`src/module-*`) so all
# modules resolve together, requiring every module with an explicit `@dev`
# stability flag so the transitive `"*"` sibling constraints select the local
# dev versions.
#
# The matrix comes from `supported-version` with `kind: currently-supported`,
# which resolves to every actively-maintained Magento `project-community-edition`
# line (2.4.6 → 2.4.9) across their respective PHP versions — so the extension is
# validated against the whole supported range, not just the newest release.
# Standalone lint + unit coverage lives in `lint.yml`; this workflow is the real
# Magento install: unit under real PHPUnit, `setup:di:compile`, and phpcs.

name: Check Extension

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/check-extension.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/check-extension.yml'
  workflow_dispatch:

concurrency:
  group: check-extension-${{ github.ref }}
  cancel-in-progress: true

env:
  MAGENTO_REPOSITORY: https://mirror.mage-os.org/

jobs:
  compute_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported-version.outputs.matrix }}
      latest_matrix: ${{ steps.latest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: graycoreio/github-actions-magento2/supported-version@main
        id: supported-version
        with:
          kind: currently-supported
      - run: echo '${{ steps.supported-version.outputs.matrix }}'
      # Newest supported line only, for the integration-test job: a Magento
      # install + test-framework DB install is the dominant fixed cost, so the
      # PR gate runs one line (docs/20-integration-test-plan.md §2.3). Numeric
      # sort over every digit group handles patch suffixes ("2.4.9-p1").
      - name: Reduce to newest supported line
        id: latest
        run: |
          latest=$(echo '${{ steps.supported-version.outputs.matrix }}' | jq -c \
            '{include: ([.include[] | . + {__v: (.magento | [scan("[0-9]+")] | map(tonumber))}]
              | [max_by(.__v)] | map(del(.__v)))}')
          echo "matrix=$latest" >> "$GITHUB_OUTPUT"
          echo "$latest"

  # BLOCKING. Runs the whole Test/Unit suite under each supported Magento's real
  # PHPUnit (one matrix entry per supported line, 2.4.6 → 2.4.9). The suites are
  # authored against this repo's shim layer (dev/tests/shims/) AND run here under
  # real Magento: their test doubles were reconciled to the real Magento
  # class/interface signatures (every double implements the full interface;
  # params widened to the untyped Magento contracts; Api builders extend the real
  # concrete classes). The same doubles still pass the shim runner in lint.yml
  # (php dev/tests/standalone-runner.php) on PHP 8.1–8.5, since every change was
  # additive/widening.
  unit-test-extension:
    runs-on: ${{ matrix.os }}
    needs: compute_matrix
    strategy:
      fail-fast: false
      # ECONOMY MODE: newest supported line only while the account is near its
      # CI-minutes cap. Full-matrix coverage last green at 951e05e; restore
      # `outputs.matrix` here when minutes allow.
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.latest_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: graycoreio/github-actions-magento2/setup-magento@main
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGENTO_REPOSITORY }}

      - name: Register monorepo package repositories
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer config repositories.mageos-workflows path '${{ github.workspace }}/src/module-*'

      - name: Require all workflow modules
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          pkgs=$(for f in ${{ github.workspace }}/src/module-*/composer.json; do
            printf '%s:@dev ' "$(jq -r .name "$f")"
          done)
          echo "Requiring: $pkgs"
          composer require $pkgs --no-install

      - run: composer update --no-install
        working-directory: ${{ steps.setup-magento.outputs.path }}

      - uses: graycoreio/github-actions-magento2/cache-magento@main
        with:
          working-directory: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      # The published spec/ schemas + conformance fixtures live at the monorepo
      # root, not inside any module package, so they are absent from the vendor
      # install. Several unit tests read them via dirname(__DIR__, 6) . '/spec/…'
      # which resolves to <magento>/vendor/spec — stage them there. (The bundled
      # template data dirs, by contrast, DO ship inside their packages and are
      # copied by composer's path-repo mirror, so they need no staging.)
      - name: Stage monorepo spec/ fixtures
        run: cp -r "${{ github.workspace }}/spec" "${{ steps.setup-magento.outputs.path }}/vendor/spec"

      - name: Configure phpunit.xml.dist
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          ## Add a testsuite covering every module's Test/Unit tree (installed
          ## under vendor/mage-os/workflows*). mageos-async-events lives under
          ## vendor/mage-os/mageos-* and is excluded by the `workflows` prefix.
          cat > /tmp/testsuite.xml << 'EOF'
                  <testsuite name="MageOS_Workflows_Unit">
                      <directory>../../../vendor/mage-os/workflows*/Test/Unit</directory>
                  </testsuite>
          EOF
          sed -i '/<testsuites>/r /tmp/testsuite.xml' dev/tests/unit/phpunit.xml.dist

          ## Disable allure (See https://github.com/magento/magento2/issues/36702 )
          sed -i '/<extensions>/,/<\/extensions>/d' dev/tests/unit/phpunit.xml.dist

      - name: Run extension unit tests
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: vendor/bin/phpunit -c dev/tests/unit/phpunit.xml.dist --testsuite MageOS_Workflows_Unit

  # BLOCKING. setup:di:compile loads every class against each supported Magento.
  # All defects it surfaced are fixed: AbstractModel::setEntityId param widening,
  # the DecisionPanel readonly-$formKey collision, and WorkflowNotifier — now
  # implementing the real mageos-async-events contract
  # notify(AsyncEventInterface, CloudEventImmutable): NotifierResult (with the
  # notifierClasses DI pool wiring corrected).
  compile-extension:
    runs-on: ${{ matrix.os }}
    needs: compute_matrix
    strategy:
      fail-fast: false
      # ECONOMY MODE: newest supported line only while the account is near its
      # CI-minutes cap. Full-matrix coverage last green at 951e05e; restore
      # `outputs.matrix` here when minutes allow.
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.latest_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: graycoreio/github-actions-magento2/setup-magento@main
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGENTO_REPOSITORY }}

      - name: Register monorepo package repositories
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer config repositories.mageos-workflows path '${{ github.workspace }}/src/module-*'

      - name: Require all workflow modules
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          pkgs=$(for f in ${{ github.workspace }}/src/module-*/composer.json; do
            printf '%s:@dev ' "$(jq -r .name "$f")"
          done)
          echo "Requiring: $pkgs"
          composer require $pkgs --no-install

      - run: composer update --no-install
        working-directory: ${{ steps.setup-magento.outputs.path }}

      - uses: graycoreio/github-actions-magento2/cache-magento@main
        with:
          working-directory: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      - uses: graycoreio/github-actions-magento2/setup-di-compile@main
        with:
          path: ${{ steps.setup-magento.outputs.path }}

  coding-standard:
    runs-on: ${{ matrix.os }}
    needs: compute_matrix
    strategy:
      fail-fast: false
      # ECONOMY MODE: newest supported line only while the account is near its
      # CI-minutes cap. Full-matrix coverage last green at 951e05e; restore
      # `outputs.matrix` here when minutes allow.
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.latest_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          coverage: none

      # Install the Magento coding standard + PHP-compatibility sniffs. The
      # dealerdirect installer plugin registers the standards' installed_paths
      # so `--standard=Magento2` resolves.
      - name: Install Magento coding standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require magento/magento-coding-standard magento/php-compatibility-fork
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      # Gate on phpcs ERRORS (including PHP 8.5 compatibility errors) via the
      # committed phpcs.xml.dist (Magento2 standard, warning-severity 0). The
      # graycoreio coding-standard action's own inputs (ignore_warnings) and a
      # repo phpcs.xml.dist were both ignored by its phpcs invocation, so run
      # phpcs directly from the repo root where it auto-discovers the ruleset.
      # This pre-alpha tree's advisory docblock/style WARNINGS stay non-blocking
      # so the job tracks real breakage rather than a docblock backlog.
      - name: Run phpcs (Magento2, error-gated)
        run: phpcs -p

  # ADVISORY FOR NOW, BLOCKING ONCE THE BASELINE IS COMMITTED (issue #8).
  # PHPStan level 6 over the checked-out src/, with a real Magento install
  # supplying the framework symbols — same install recipe as the unit/compile
  # jobs, newest supported line only (phpstan findings barely vary by Magento
  # minor, unlike runtime behavior).
  #
  # Two deliberate differences from the sibling jobs:
  #
  #  * No COMPOSER_MIRROR_PATH_REPOS, so Composer symlinks src/module-* into
  #    <magento>/vendor/mage-os/ rather than copying it. Analysis then sees a
  #    single copy of every class instead of a checked-out original plus a
  #    vendor duplicate.
  #  * PHPStan runs from the repo root against `src/` (not against the vendor
  #    copies), so reported paths — and every phpstan-baseline.neon entry —
  #    are repo-relative and stable. The Magento install is reachable only via
  #    the generated overlay config below.
  #
  # The baseline shipped in this repo is empty: a truthful one can only be
  # produced against a real install, i.e. here. Until it is populated the
  # analysis step is `continue-on-error` and uploads the generated baseline as
  # an artifact; committing that artifact and deleting the `continue-on-error`
  # line flips this job blocking.
  static-analysis:
    runs-on: ${{ matrix.os }}
    needs: compute_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.latest_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: graycoreio/github-actions-magento2/setup-magento@main
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGENTO_REPOSITORY }}

      - name: Register monorepo package repositories
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer config repositories.mageos-workflows path '${{ github.workspace }}/src/module-*'

      - name: Require all workflow modules
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          pkgs=$(for f in ${{ github.workspace }}/src/module-*/composer.json; do
            printf '%s:@dev ' "$(jq -r .name "$f")"
          done)
          echo "Requiring: $pkgs"
          composer require $pkgs --no-install

      - run: composer update --no-install
        working-directory: ${{ steps.setup-magento.outputs.path }}

      - uses: graycoreio/github-actions-magento2/cache-magento@main
        with:
          working-directory: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install

      # phpstan + bitexpert/phpstan-magento are pinned in this repo's own
      # require-dev (not the Magento install's) so the analysis toolchain is
      # versioned here and runnable locally; only framework symbols come from
      # the install. Magento's composer.json is left untouched.
      - name: Install analysis toolchain
        run: composer install --no-interaction --no-progress

      # phpstan.neon.dist is deliberately install-location agnostic; this is the
      # only place the Magento path is bound. magentoRoot drives the generated
      # factory/proxy/extension-attribute resolution in bitexpert's extension,
      # bootstrapFiles gives PHPStan the framework autoloader.
      - name: Write CI overlay config
        run: |
          cat > phpstan-ci.neon <<EOF
          includes:
              - phpstan.neon.dist
          parameters:
              magento:
                  magentoRoot: ${{ steps.setup-magento.outputs.path }}
              bootstrapFiles:
                  - ${{ steps.setup-magento.outputs.path }}/vendor/autoload.php
          EOF
          cat phpstan-ci.neon

      - name: Run PHPStan (level 6)
        id: phpstan
        # TODO(#8): delete this line once phpstan-baseline.neon is populated
        # from the artifact produced below.
        continue-on-error: true
        run: vendor/bin/phpstan analyse -c phpstan-ci.neon --no-progress --memory-limit=2G

      # Everything PHPStan reported that is not already in phpstan-baseline.neon,
      # in directly committable form (paths relative to the repo root).
      - name: Generate baseline artifact
        if: steps.phpstan.outcome == 'failure'
        run: |
          vendor/bin/phpstan analyse -c phpstan-ci.neon --no-progress --memory-limit=2G \
            --generate-baseline phpstan-baseline.generated.neon || true

      - name: Upload baseline artifact
        if: steps.phpstan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-baseline-${{ matrix.magento }}
          path: phpstan-baseline.generated.neon
          if-no-files-found: warn

  # BLOCKING, newest supported line only. The Magento integration-test lane
  # (docs/20-integration-test-plan.md): suites at src/*/Test/Integration run
  # inside a real install's dev/tests/integration framework — real MySQL,
  # merged DI, EAV, db-transport queue. The framework installs its own test
  # database from install-config-mysql.php (dev/tests/integration-config/ in
  # this repo); no amqp is configured so consumers run in-process. The full
  # supported matrix is deliberately NOT run here on PRs — install cost
  # dominates and behavior is far less version-sensitive than class
  # signatures (the unit + compile jobs cover the range).
  integration-test-extension:
    runs-on: ${{ matrix.os }}
    needs: compute_matrix
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.latest_matrix) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: magento_integration_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      opensearch:
        image: opensearchproject/opensearch:2.11.1
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: graycoreio/github-actions-magento2/setup-magento@main
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGENTO_REPOSITORY }}

      - name: Register monorepo package repositories
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer config repositories.mageos-workflows path '${{ github.workspace }}/src/module-*'

      # Same require set as the unit/compile jobs. mage-os/mageos-async-events
      # arrives transitively (workflows-triggers-core requires >=4.0), so the
      # async-events fidelity suites run against the REAL package here.
      - name: Require all workflow modules
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          pkgs=$(for f in ${{ github.workspace }}/src/module-*/composer.json; do
            printf '%s:@dev ' "$(jq -r .name "$f")"
          done)
          echo "Requiring: $pkgs"
          composer require $pkgs --no-install

      - run: composer update --no-install
        working-directory: ${{ steps.setup-magento.outputs.path }}

      - uses: graycoreio/github-actions-magento2/cache-magento@main
        with:
          working-directory: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      # Same staging as the unit job: conformance suites read the published
      # schemas + fixtures from <magento>/vendor/spec.
      - name: Stage monorepo spec/ fixtures
        run: cp -r "${{ github.workspace }}/spec" "${{ steps.setup-magento.outputs.path }}/vendor/spec"

      # Point the framework at the service containers and register our
      # testsuite inside Magento's own (version-correct) phpunit.xml.dist.
      # The MageOS_Workflows_Integration suite covers every module's
      # Test/Integration tree; --testsuite below keeps Magento's own
      # integration testsuite out of the run.
      - name: Configure integration test framework
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          cp '${{ github.workspace }}/dev/tests/integration-config/install-config-mysql.php' \
            dev/tests/integration/etc/install-config-mysql.php

          cat > /tmp/int-testsuite.xml << 'EOF'
                  <testsuite name="MageOS_Workflows_Integration">
                      <directory>../../../vendor/mage-os/workflows*/Test/Integration</directory>
                  </testsuite>
          EOF
          sed -i '/<testsuites>/r /tmp/int-testsuite.xml' dev/tests/integration/phpunit.xml.dist

          ## Disable ONLY the Allure extension (magento/magento2#36702). The
          ## integration <extensions> block ALSO registers
          ## Magento\TestFramework\Event\Subscribers — the framework's entire
          ## event wiring (data fixtures, db/app isolation, app-area handling).
          ## Deleting the whole block (as the unit job safely does with ITS
          ## allure-only block) silently disabled every fixture and isolation
          ## annotation in the suite.
          sed -i '/<bootstrap class="Qameta/,/<\/bootstrap>/d' dev/tests/integration/phpunit.xml.dist

      # First run installs the test-framework database (the dominant cost);
      # the tests themselves follow in the same process. `known-divergence`
      # is the quarantine group for executable pins of OPEN findings-registry
      # entries (docs/20 §2.4): they encode documented behavior the code does
      # not implement yet, so they are excluded from the blocking gate and
      # reported by the (planned) nightly full-matrix run instead.
      - name: Run extension integration tests
        working-directory: ${{ steps.setup-magento.outputs.path }}/dev/tests/integration
        run: |
          ../../../vendor/bin/phpunit -c phpunit.xml.dist \
            --testsuite MageOS_Workflows_Integration \
            --exclude-group known-divergence
